name: quackflow-f14  # Docker verlangt Kleinbuchstaben

services:
  extractor:
    build: ./extractor
    restart: unless-stopped
    # nur intern erreichbar; zum Debuggen ggf. "8001:8001" freigeben

  app:
    build: ./app
    restart: unless-stopped
    depends_on: [extractor]
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      EXTRACTOR_URL: http://extractor:8001
      DATA_DIR: /data
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      LLM_MAX_CHARS: ${LLM_MAX_CHARS:-60000}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_VERIFY_SSL: ${LLM_VERIFY_SSL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
